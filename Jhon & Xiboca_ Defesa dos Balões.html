button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid #4a3f86;border-radius:12px;padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--mint)}

.tw small{display:block;opacity:.8;font-size:.78rem;max-width:170px}

.go{background:var(--mint);color:#08141a;border-color:var(--mint);font-weight:600}
#msg{min-height:1.2em;font-size:.9rem;opacity:.85;text-align:center}

else{inr.forEach(pop);s.fx.push({ring:1,x:t.x,y:t.y,r:10,max:d.r,l:.4});t.cd=1.5}t.fl=.15}
